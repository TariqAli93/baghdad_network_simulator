title: Run Simulation
caption: Single- or multi-site coverage for all five scenarios. The run has its own process; finished traces are cached, so a cancelled run resumes where it stopped.
area: Area
area_help: Every area with a built dataset can be simulated; only the study district can give complete data. Other areas are for comparison and experimentation.
variant: Dataset
profile: Profile
profile_help: Sets the baseline cell size and ray count of the parameters below.
profile_option: "{name} — {cell} m, {rays} rays"
reset: Reset to research baseline
reset_help: Restore every parameter below to the research-baseline values.
backend: Ray-tracing backend
backends: {cpu: CPU, auto: "Auto (GPU if available)", gpu: GPU}
backend_help: CPU is the research backend. GPU maps agree closely with CPU maps in most cells but differed by up to 26 dB in single cells on a harder case (docs/validation.md §7); they are cached separately.
gpu_available: A GPU is available on this computer.
gpu_unavailable: No usable GPU on this computer; the CPU backend is used.
sites: Sites
site_modes: {rule: "candidate rooftops (site rule)", chosen: chosen buildings}
count: Number of sites (1 = single site)
chosen: "Building IDs, in order (for “chosen buildings”)"
parameters: Experiment parameters (research-baseline values unless you change them)
groups: {radio: Radio, coverage: Coverage and load, resolution: Resolution and environment, candidates: Candidate sites}
