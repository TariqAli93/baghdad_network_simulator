  rate_cdf: Shannon data-rate distribution (upper bound)
cdf_note: "Unreached outdoor cells enter the SINR curve at −40 dB and the rate percentiles with 0. Shannon rate = one user with the whole carrier: a theoretical link bound, not capacity or throughput."
frequency_axis: "frequency [GHz]"
network:
  title: Single site vs network
  network: "network [%]"
