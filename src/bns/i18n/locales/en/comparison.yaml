  growth: Coverage vs number of sites (given order)
  sites_axis: sites
runs:
  select: Runs to compare
  differ: "`{other}` differs from `{ref}` in: **{items}**. These are not the same experiment; read differences as the combined effect of all of them."
  same: "`{other}` and `{ref}` share area, grid, profile, mechanisms, antennas, radio parameters, load and backend."
  metrics:
    coverage: "coverage [%]"
    sinr_median_db: "median SINR [dB]"
    rate_p5_mbps: "5th-percentile Shannon rate [Mbit/s]"
    rate_median_mbps: "median Shannon rate [Mbit/s]"
  need_two: Select at least two runs.
plans:
  none: No saved site plan yet (scripts/plan_sites.py or the Site Planning page).
  case: "threshold {threshold} dB, load {load}"
  chart: Sites selected by the SINR greedy vs frequency
  columns: {band: Band, threshold: "Threshold [dB]", load: Load, sites: Sites, density: "Sites per km²", coverage: Coverage, target: Target, stop: Stop reason, candidates: Candidates, profile: Profile, backend: Backend}
  note: "Greedy over the saved candidates (heuristic, not a minimum). “no candidate raises coverage” is a local stall, not proof that the target is unreachable. Density = sites / 1 km² receiver area."
