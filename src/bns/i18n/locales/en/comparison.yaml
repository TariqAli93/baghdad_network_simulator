title: Network Comparison
caption: The five scenarios on the same grid, sites and radio system — only frequency and bandwidth differ — plus comparisons across runs, site counts, the 3GPP check and sensitivity.
tabs: {bands: Scenarios in one run, runs: Across runs, sites: Site counts, model: 3GPP model check, sensitivity: Sensitivity Analysis, limitations: Limitations}
columns:
  scenario: Scenario
  coverage: "Coverage [%]"
  rx_power: "Median received power [dBm]"
  sinr: "Median SINR [dB]"
  rate_p5: "5th-percentile data rate [Mbit/s]"
  rate_median: "Median data rate [Mbit/s]"
charts:
  coverage: Coverage by frequency
