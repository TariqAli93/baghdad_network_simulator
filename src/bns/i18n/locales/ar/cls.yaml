  validated_results: الإعدادات البحثية الأساسية على بيانات قياس مكتملة مع اكتمال التحقق العلمي.
  baseline_pending: الإعدادات البحثية الأساسية على بيانات مكتملة، والتحقق العلمي ما يزال قيد الانتظار.
