limits:
  dataset: "الإعدادات البحثية الأساسية (المنطقة، وطريقة بيانات المباني، ومعاملات الراديو، وقاعدة المواقع) محددة، لكن مجموعة البيانات ليست بعدُ بيانات قياس مكتملة (الأرصاد الميدانية): الأدلة أعلاه من محاكاة بافتراضات معلنة."
  shannon: معدلات شانون حدود نظرية عليا لمستخدم واحد يشغل الحامل كله؛ والتحويل وفق 3GPP بجانبها يستخدم LTE (TR 36.942) للجيل الرابع، وNR (TR 38.921) للجيل الخامس، وقيم NR تقريبًا للجيل السادس المرشّح.
  bands: النطاقان 8 و15 GHz نطاقان بحثيان مرشّحان (دراسات WRC-27)، وليسا مواصفات نهائية للجيل السادس.
  press: الحقائق المستندة إلى الصحافة عن حالة الجيل الخامس في العراق تعتمد على مصادر قليلة، ويجب التحقق منها مجددًا قبل التسليم.
stages:
  preparation:
    title: التحضير وتقييم البنية التحتية
    purpose: ما الموجود اليوم، وما الذي ستُبنى عليه شبكة قادرة على الجيل السادس.
  spectrum:
    title: تخطيط الطيف الترددي
    purpose: النطاقات التي يمكن للجهة التنظيمية التخطيط لها استنادًا إلى الدراسات الدولية.
  trials:
    title: التجارب الميدانية
    purpose: ما الذي يجب أن تقيسه تجربة ما لتحلّ الأدلة محل افتراضات هذه الدراسة.
  commercial:
    title: الإطلاق التجاري المحتمل
    purpose: الشروط التي قد يلي فيها إطلاق تجاري للجيل السادس؛ ولا يُفترض أي تاريخ.
# نصوص البنود: المصدر الإنجليزي في configs/roadmap.yaml، وهذه المفاتيح ترجمته بندًا بندًا
items:
  preparation:
    i0: أطلق المشغّلون الثلاثة خدمة LTE على 1800 MHz في يناير 2021؛ والجيل الثاني على 900/1800 MHz، والجيل الثالث على 2100 MHz.
    i1: تغطية الجيل الرابع للسكان 96.6 % (رقم الاتحاد الدولي للاتصالات لعام 2022، كما نقلته هيئة الإعلام والاتصالات).
    i2: حتى نوفمبر 2026 لم يطلق أي مشغّل خدمة جيل خامس تجارية في العراق؛ وكان المشغّلون يجرون تجارب، وأُفيد بأن الجهة التنظيمية تخطط لمزاد للجيل الخامس في 2027 (مصدر صحفي واحد عمره يوم واحد؛ يحتاج إلى تأكيد).
    i3: عدد المواقع اللازمة لكل km² في منطقة التطوير، لكل نطاق (خوارزمية جشعة، وليس حدًا أدنى).
    i4: أي الأسطح والصواري الحالية يمكن أن تستضيف قطاعات النطاق المتوسط والمتوسط الأعلى، وعلى أي ارتفاع؟ (يعتمد على القرارين A1 وA4 وعلى الرصد الميداني للمباني العالية.)
  spectrum:
    i0: تسمّي خطة الجيل الخامس لدى الجهة التنظيمية النطاقين 700 MHz و2.6/2.3 GHz أولًا، والنطاق 3.4-3.8 GHz نطاقَ السعة الرئيسي، مع تقييم كتل متصلة بعرض 100 MHz لكل حامل رخصة. لم يُخصَّص أي طيف للجيل الخامس بعد.
    i1: يدرس البند 1.7 من جدول أعمال WRC-27 النطاقات 4 400-4 800 MHz و7 125-8 400 MHz و14.8-15.35 GHz للاتصالات المتنقلة الدولية IMT؛ وفي الإقليم 1 (العراق) 7 125-7 250 MHz و7 750-8 400 MHz و14.8-15.35 GHz.
    i2: ستنظر المجموعة العربية لإدارة الطيف في تحديد النطاقات 7 125-7 250 و7 750-8 400 MHz و14.8-15.35 GHz بناءً على نتائج الدراسات، شريطة حماية الخدمات القائمة.
    i3: يُستخدم النطاق 14.8-15.3 GHz اليوم في العراق للوصلات الثابتة وأنظمة الدفاع؛ والنطاق 3.3-3.4 GHz للتحديد الراديوي العسكري.
    i4: يُعقد WRC-27 من 18 أكتوبر إلى 12 نوفمبر 2027 (شنغهاي).
    i5: التغطية ووسيط SINR ومعدل شانون عند المئين الخامس لكل نطاق مرشّح في عمليات التشغيل التطويرية.
    i6: كيف ستُدار المشاركة مع الوصلات الثابتة والدفاعية القائمة عند 15 GHz في بغداد؟
  trials:
    i0: "يتضمن الإصدار 21 من 3GPP أولى مواصفات الجيل السادس: إقرار المحتوى في مارس 2027، وتجميد المرحلة 3 في ديسمبر 2028، وتجميد ASN.1/OpenAPI في مارس 2029 (مواعيد تخطيط لدى هيئة التقييس، وليست مواعيد نشر)."
    i1: افتُتح مختبر للجيل الخامس لأغراض تعليمية في جامعة النهرين بالتعاون مع آسياسيل (بيانات صحفية).
    i2: مدى توافق متتبّع الأشعة مع نماذج فقد المسار في 3GPP TR 38.901 (مقارنة نموذج بنموذج، وليست قياسات).
    i3: أي القياسات (ارتفاعات الأسطح، واختبارات القيادة عند 3.5 GHz، ووصلة قصيرة عند 8 أو 15 GHz) ستقلّل أكثر من عدم اليقين في النتائج؟ (حساسية الارتفاعات وظل السطح قرب الموقع مرشّحان.)
  commercial:
    i0: هدف التقييم لدى 3GPP للجيل السادس في البيئة الحضرية الكثيفة هو معدل بيانات للمستخدم عند المئين الخامس قدره 300 Mbit/s في الوصلة الهابطة، مع مسافة 200 m بين المواقع الكبرى.
    i1: "عروض النطاق لتقييم الجيل السادس: 400 MHz مجمّعة عند 7 GHz وعند 15 GHz؛ و1 GHz عند 30 GHz."
    i2: "المفاضلة بين التغطية والسعة: الحوامل المرشّحة الأعرض ترفع حد شانون لكنها تحتاج إلى مواقع أكثر للتغطية نفسها (نتائج تطويرية؛ حد شانون، وليس إنتاجية)."
    i3: هل ستحقق النطاقات المرشّحة هدف 300 Mbit/s عند المئين الخامس بكثافة مواقع واقعية بعد إدخال الحِمل والجدولة وبيانات المباني الحقيقية؟ (لا يمكن الإجابة عنه من النموذج الحالي.)
