title: تشغيل المحاكاة
caption: تغطية موقع واحد أو عدة مواقع للسيناريوهات الخمسة. يعمل التشغيل في عملية مستقلة، وتُحفظ التتبعات المكتملة مؤقتًا، فيستأنف التشغيل الملغى من حيث توقف.
