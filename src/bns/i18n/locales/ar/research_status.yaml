title: حالة البحث
caption: 'ما يمكن استخدام نتائج الدراسة له اليوم: مجموعة البيانات والإعدادات وأدلة التحقق.'
area: 'منطقة الدراسة: **{name}**، منطقة الاستقبال {size}؛ مجموعة البيانات الأساسية {variant}.'
classification: كيف تُصنَّف النتائج
classification_text: تذكر كل نتيجة إعداداتها (بحثية أساسية أو تجربة مخصّصة أو تحليل حساسية)، وتوزيع محطاتها (آلي أو يدوي أو افتراضي)، ومجموعة بياناتها (مكتملة أو بارتفاعات تقديرية أو غير مكتملة)، وتحققها (مكتمل أو قيد الانتظار)، منفصلةً عن حالة تنفيذها.
indicators: مؤشرات الجاهزية
limitations: قيود عامة
