title: تخطيط مواقع المحطات
caption: اختيار جشع مبني على SINR بين مواقع تشغيل متعدد المواقع محفوظ. يشمل كل تقييم تداخل جميع القطاعات المختارة؛ ويُقرأ كسب المسار من الذاكرة المؤقتة دون أي تتبّع جديد.
heuristic: نتيجة الخوارزمية الجشعة طريقة استدلالية على هذه المرشّحات فقط، وليست حدًا أدنى مثبتًا. قد تخفّض إضافة موقع التغطية، وتُدرج هذه الإضافات.
new_plan: "أنشئ خطة جديدة بالأمر `uv run python scripts/plan_sites.py --area NAME [--backend gpu] [--threshold DB --load X]` (يتتبّع فقط ما ليس محفوظًا)."
saved_plan: "**خطة محفوظة** `{run}` — {candidates} (سطح ≥ {height} m، وتباعد ≥ {spacing} m، وأنواع ارتفاع {categories}؛ صاري {mast} m، والهوائيات في {position} السطح)؛ الهدف: {objective}. القيم المعدّلة: {overrides}. التتبّع {trace} ثانية، والاختيار {selection} ثانية ({backend})."
