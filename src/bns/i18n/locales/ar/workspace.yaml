title: مساحة عمل المحاكاة
caption: اضبط الإعدادات، ضع المحطات، شغّل المحاكاة، اعرض النتائج وقارن. يُحسب كسب المسار بتتبّع الأشعة في Sionna RT، وتُعاد حسابات القدرة المستقبلة وSINR والمعدلات من الذاكرة المؤقتة.
