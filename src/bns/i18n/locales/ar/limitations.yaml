general:
  heights: >-
    ارتفاعات المباني: المخططات والإحداثيات حقيقية، أما الارتفاعات فموثّقة لعدد قليل من المباني فقط.
    تستخدم المحاكاة على النموذج الحضري الاصطناعي ارتفاعات تقديرية (افتراضات نمذجة وليست قياسات)،
    والمحاكاة على ارتفاعات افتراضية مؤقتة محاكاة أولية. ولا يمثل أيٌّ منهما وصفًا تجريبيًا لبغداد.
  validated: >-
    لا تُعدّ نتيجةً بحثية مستوفية للتحقق إلا محاكاةُ الإعدادات البحثية الأساسية على بيانات صالحة للبحث،
    بعد التحقق من تقارب الأشعة على المشهد النهائي والمقارنة مع MATLAB؛ وما سوى ذلك أولي أو تجريبي.
  shannon: >-
    معدلات شانون حدود نظرية عليا لمستخدم واحد يستخدم كامل عرض النطاق، وليست سعة الشبكة ولا إنتاجية
    المستخدم. ويُعرض بجانبها تحويل 3GPP حيث يتوفر.
  greedy: اختيار المواقع بالخوارزمية الجشعة طريقة تقريبية، ولا يعطي الحد الأدنى لعدد المواقع.
  validation_scope: >-
    ما أُنجز من التحقق حتى الآن: فحوص تحليلية ومقارنة مع نموذج 3GPP TR 38.901 (مقارنة نموذج بنموذج).
    حُزمة المقارنة مع MATLAB جاهزة ولم تُنفَّذ؛ ولا توجد قياسات ميدانية.
  candidate_6g: >-
    نطاقا الجيل السادس المرشّح (8 و15 GHz) افتراضات بحثية، وليسا مواصفات تجارية نهائية للجيل السادس.
  runs_compared: >-
    تُقارن المحاكاتان بوصفهما تجربة واحدة فقط عند تطابق المنطقة والشبكة الحسابية والملف التعريفي وآليات
    الانتشار والهوائيات ومعاملات الراديو والحمل والمعالج؛ وإلا يظهر تنبيه يحدد الفروق.
