scenarios_note: لا يختلف بين السيناريوهات إلا التردد وعرض النطاق (تجربة مضبوطة، docs/methodology.md). نطاقات الجيل السادس افتراضات بحثية مرشّحة؛ ونطاق 3.5 GHz في العراق مفترض.
parameters: معاملات نظام الراديو (الإعدادات البحثية الأساسية)
parameters_note: "هذه قيم الإعدادات البحثية الأساسية (configs/radio_system.yaml). لتجربة قيم أخرى غيّرها لتشغيل واحد في صفحة **تشغيل المحاكاة**: يُسجَّل التشغيل تجربةً مخصصة مع القيم التي استخدمها. نمط الهوائي المتتبَّع وفق TR 38.901 يتضمن ذروة الكسب 8 dBi، فلا يُضاف كسب هوائي فوقه."
rates: نماذج معدل نقل البيانات
rates_note: "يُعرض حد شانون لكل نطاق، ويُعرض التحويل العملي بجانبه وليس بدلًا منه. يستخدم الجيل السادس المرشّح قيم NR تقريبًا بحثيًا، إذ لا يوجد تحويل على مستوى الوصلة للجيل السادس. التحقق مقابل TR 36.942 وTR 38.921: docs/rate-mapping-verification.md."
english_fields: أسس السيناريوهات والتعريفات والمصادر نصوص الإعدادات الأصلية باللغة الإنجليزية.
