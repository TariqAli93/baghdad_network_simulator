[project]
name = "baghdad-network-simulator"
version = "0.0.1"
description = "Ray-tracing study of 4G, 5G and candidate 6G coverage and data rate in Baghdad"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sionna-rt==2.2.0",
    "numpy>=1.26",
    "scipy>=1.14",
    "matplotlib>=3.10",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "mapbox-earcut>=1.0",
    "pyshp>=2.3",
    "streamlit>=1.40",
    "plotly>=5.24",
    "itur==0.4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: runs the real Sionna RT engine on the CPU (slow)",
           "app: runs every application page headless on the saved development data"]
addopts = "-m 'not engine and not app'"
# pyshp warns about the size field of files written by its own writer in the tests.
filterwarnings = ["ignore::shapefile.PossiblyCorruptFileHeader"]
