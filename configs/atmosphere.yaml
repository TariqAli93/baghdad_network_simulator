# Atmospheric conditions (docs/atmospheric-losses.md).
#
# Baseline for every result: clear sky. Gas attenuation is included (it is tiny but real);
# rain is not, because no rain rate for Baghdad has been approved.
baseline:
  name: clear sky
  rain_rate_mm_h: 0.0
  include_gas: true

# Rain cases for a separate sensitivity experiment, NEVER part of the baseline. The 18.6 mm/h
# case is approved as an optional sensitivity case only (C2, reported 2026-11-27), qualified by
# the older map edition below; the other two are not approved.
# The rates come from the ITU's digital rain maps, but from the previous edition
# (ITU-R P.837-7), read through the open-source library ITU-Rpy 0.4.0 at 33.328 N, 44.4085 E
# on 2026-11-26. The edition in force is P.837-8 (09/2025), whose map value for Baghdad has
# not been read (docs/supervisor-decisions.md, decision D8).
rain_sensitivity:
  cases:
    - label: rain rate exceeded 0.1 % of an average year (about 9 hours)
      rain_rate_mm_h: 4.1
      approved: false
      source: ITU-R P.837-7 digital maps via ITU-Rpy 0.4.0 (superseded edition)
    - label: rain rate exceeded 0.01 % of an average year (about 53 minutes)
      rain_rate_mm_h: 18.6
      approved: true      # as a sensitivity case only (C2); never the baseline
      source: ITU-R P.837-7 digital maps via ITU-Rpy 0.4.0 (superseded edition)
    - label: rain rate exceeded 0.001 % of an average year (about 5 minutes)
      rain_rate_mm_h: 55.1
      approved: false
      source: ITU-R P.837-7 digital maps via ITU-Rpy 0.4.0 (superseded edition)
