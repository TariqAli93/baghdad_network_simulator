# 6G roadmap workspace (Phase 10). Structure and evidence only; conclusions are the student's.
#
# kind:
#   verified   a fact from a registered source (docs/references.md; IDs checked by a unit test)
#   result     a provisional experimental result: the app fills it from saved runs, with their label
#   question   an open question the evidence raises; no answer is implied
# No date below is a confirmed deployment date. Recommendations are written by the student in
# the app and stored separately (outputs/roadmap/student_recommendations.json).
stages:
  - id: preparation
    title: Preparation and infrastructure assessment
    purpose: >-
      What exists today and what a 6G-capable network would build on.
    items:
      - kind: verified
        text: All three operators launched LTE on 1800 MHz in January 2021; 2G on 900/1800 MHz, 3G on 2100 MHz.
        sources: [IRQ-CMC-WP]
      - kind: verified
        text: 4G population coverage 96.6 % (ITU figure for 2022, quoted by the CMC).
        sources: [IRQ-CMC-WP]
      - kind: verified
        text: >-
          As of November 2026 no operator had launched commercial 5G in Iraq; operators were running trials and
          the regulator was reported to plan a 5G auction for 2027 (single, one-day-old press source; confirm).
        sources: [IRQ-ZAIN-IR, IRQ-ASIACELL-LAB, IRQ-CMC-2026]
      - kind: result
        metric: site_density
        text: Sites needed per km² in the development district, per band (greedy, not a minimum).
      - kind: question
        text: >-
          Which existing rooftops and masts could host mid-band and upper-mid-band sectors, and at what height?
          (Depends on decisions A1 and A4 and on field observation of tall buildings.)
  - id: spectrum
    title: Spectrum planning
    purpose: >-
      Which bands the regulator could plan for, on the basis of international studies.
    items:
      - kind: verified
        text: >-
          The regulator's 5G plan names 700 MHz and 2.6/2.3 GHz first and 3.4-3.8 GHz as the key capacity band,
          with contiguous 100 MHz blocks per licence holder to be evaluated. No 5G spectrum has been assigned.
        sources: [IRQ-CMC-WP]
      - kind: verified
        text: >-
          WRC-27 agenda item 1.7 studies 4 400-4 800 MHz, 7 125-8 400 MHz and 14.8-15.35 GHz for IMT; in Region 1
          (Iraq) 7 125-7 250 MHz, 7 750-8 400 MHz and 14.8-15.35 GHz.
        sources: [ITU-RES256]
      - kind: verified
        text: >-
          The Arab Spectrum Management Group would consider identifying 7 125-7 250, 7 750-8 400 MHz and
          14.8-15.35 GHz on the study results, provided incumbent services are protected.
        sources: [ASMG-AI17]
      - kind: verified
        text: 14.8-15.3 GHz is used today in Iraq for fixed links and defence systems; 3.3-3.4 GHz for military radiolocation.
        sources: [IRQ-NFAT]
      - kind: verified
        text: WRC-27 takes place 18 October - 12 November 2027 (Shanghai).
        sources: [ITU-WRC27]
      - kind: result
        metric: band_comparison
        text: Coverage, median SINR and 5th-percentile Shannon rate per candidate band in the development runs.
      - kind: question
        text: How would sharing with incumbent fixed and defence links at 15 GHz be handled in Baghdad?
  - id: trials
    title: Experimental trials
    purpose: >-
      What a trial would need to measure to replace this study's assumptions with evidence.
    items:
      - kind: verified
        text: >-
          3GPP Release 21 holds the first 6G specifications: content approved March 2027, Stage 3 frozen December 2028,
          ASN.1/OpenAPI frozen March 2029 (planning dates of the standards body, not deployment dates).
        sources: [3GPP-REL21]
      - kind: verified
        text: >-
          A 5G lab for educational purposes opened at Al-Nahrain University with Asiacell (press releases).
        sources: [IRQ-ASIACELL-LAB]
      - kind: result
        metric: validation
        text: Agreement of the ray tracer with 3GPP TR 38.901 path-loss models (model-to-model, not measurements).
      - kind: question
        text: >-
          Which measurements (rooftop heights, drive tests at 3.5 GHz, a short 8 or 15 GHz link) would most reduce
          the uncertainty of the results? (The height sensitivity and the near-site roof shadow are candidates.)
  - id: commercial
    title: Potential commercial introduction
    purpose: >-
      Conditions under which commercial 6G could follow; no date is implied.
    items:
      - kind: verified
        text: >-
          3GPP's 6G dense-urban evaluation target is a 5th-percentile user data rate of 300 Mbit/s downlink with
          a macro inter-site distance of 200 m.
        sources: [3GPP-TR38914]
      - kind: verified
        text: >-
          6G evaluation bandwidths: 400 MHz aggregated at 7 GHz and at 15 GHz; 1 GHz at 30 GHz.
        sources: [3GPP-TR38914]
      - kind: result
        metric: capacity_tradeoff
        text: >-
          Coverage-capacity trade-off: wider candidate carriers raise the Shannon bound but need more sites for the
          same coverage (development results; Shannon bound, not throughput).
      - kind: question
        text: >-
          Would the candidate bands meet the 300 Mbit/s 5th-percentile target at a realistic site density once
          load, scheduling and real building data are included? (Not answerable from the current model.)
