# Supervisor approvals: research provenance (docs/approval-record.md explains it).
#
# Every scientific and methodological decision of the project scope is approved by the
# supervisor, as reported by the project owner (2026-11-26, 2026-11-27, and the final report of
# 2026-11-27 approving all decisions including antenna bearings, candidate criteria and the
# observation methods). No written reference or supervisor identity was supplied; none is
# needed to operate the software and none is invented here.
#
# These values form the RESEARCH BASELINE. Changing a parameter does not need a new approval:
# a run with other values is a custom (or sensitivity) experiment and records what it used.
record:
  reported_by: project owner
  reports:
    - {reported_on: 2026-11-26, scope: every recommended option of the checklist (bc750b3)}
    - {reported_on: 2026-11-27, scope: follow-up recommendations of the 2026-11-27 review}
    - {reported_on: 2026-11-27, scope: all decisions of the project scope, final (bearings, candidate criteria, observation methods)}
  approval_reference: none supplied (not required to operate the software)
  checklist_version: bc750b3 (v1.0.0-rc.1)
  approved_by_text: "supervisor, as reported by the project owner"

decisions:
  A1_study_district:
    decision: Tahrir Square / Bab Al-Sharqi
    boundary: {center_lat: 33.3280, center_lon: 44.4085, receiver_area_m: [1000, 1000], margin_m: 150}
    approved_on: 2026-11-26
    status: approved
  A2_building_data:
    footprints: OSM plus the footprints missing from OSM taken from 3D-GloBFP (footprints only, not its heights), each marked with its source
    height_priority: [observation, osm_height, osm_levels, dataset, model, placeholder]
    storey_height_m: 3.0
    external_height_datasets: >-
      none as the height source (3D-GloBFP heights and GlobalBuildingAtlas rejected as height
      sources; an external dataset enters the priority only if separately authorised)
    missing_heights: report the spread over assumed height models (sensitivity analysis)
    observations: >-
      initial stage: P0 and P1 measured or documented heights; P2 measured or documented
      preferred, storey-based estimate (3.0 m per storey) accepted when no reliable measurement
      or document exists; S (candidate survey) storey counts; P3 through the height sensitivity
      analysis. Each observation records source, method, uncertainty and limitations; estimates
      are never classified as measured. The 190-building worklist (2026-11-26) stays on record.
    licensing: GlobalBuildingAtlas used only if its CC BY-NC 4.0 licence fits the project's use; never redistributed
    approved_on: [2026-11-26, 2026-11-27]
    status: approved
  A3_radio_parameters:
    values: see configs/radio_system.yaml
    approved_on: 2026-11-26
    status: approved
  A4_site_rule:
    candidate_roofs: observed or storey-based heights; roof >= 12 m, area >= 100 m2, spacing >= 50 m; target 20-40 candidates
    threshold_refinement: >-
      after the survey the thresholds may be refined to obtain a suitable pool of 20-40
      candidates, documented with its geometric justification (configs/site_rule.yaml,
      adjustments); never tuned to coverage results; no further approval needed
    mast_height_m: 3.0
    sector_orientation: compass bearings 0, 120, 240 degrees (0 = north, clockwise); 10 degree downtilt
    antenna_position: roof edge facing each sector, 1 m inside the edge
    excluded_structures: monuments, memorials and artworks are never candidates (kept as obstacles)
    site_selection: the existing interference-aware SINR greedy
    approved_on: [2026-11-26, 2026-11-27]
    status: approved
  B1_validation:
    decision: >-
      keep the controlled TR 38.901 comparison (UMa/UMi); MATLAB is an external cross-check;
      agreement criterion: median |difference| in LOS cells <= 2.0 dB, with RMSE and the NLOS
      cells reported separately
    los_median_abs_tolerance_db: 2.0
    approved_on: [2026-11-26, 2026-11-27]
    status: approved
  B2_engine_limitations:
    decision: accepted as documented; add 2-3 MATLAB cases on reflection-then-diffraction streets
    approved_on: 2026-11-26
    status: approved
  B3_rate_reporting:
    decision: >-
      Shannon upper bound for every band, plus a practical mapping beside it: LTE (TR 36.942,
      alpha 0.6, -10 dB, cap 4.4 bit/s/Hz) for 4G; NR (TR 38.921, alpha 0.6, -10 to 30 dB) for
      5G; the NR values as a labelled research approximation for candidate 6G
    values: see configs/radio_system.yaml (rate_mappings, scenario_rate_mapping)
    approved_on: [2026-11-26, 2026-11-27]
    status: approved
  C6_gpu_for_research:
    decision: CPU for research-baseline results; GPU and auto for exploration and custom experiments
    approved_on: 2026-11-26
    status: approved
  convergence:
    decision: standard profile (10 m, 1e9 rays) for research runs, re-measured on the final scene; preview (25 m, 1e8) for development; 5 m profile disabled
    approved_on: 2026-11-26
    status: approved
  matlab:
    decision: MATLAB cross-check required before conclusions, assessed with the B1 criterion
    approved_on: 2026-11-26
    status: approved
  laptop:
    decision: the measured laptop run times are the time budget
    approved_on: 2026-11-26
    status: approved
  sensitivity_cases:
    decision: >-
      optional sensitivity experiments, never a substitute for the baseline: rain 18.6 mm/h
      (older ITU-R P.837 map edition, qualified), equal power per MHz, 50 % load, building-height
      uncertainty, array-gain illustration by link-budget arithmetic only
    approved_on: 2026-11-27
    status: approved
