# Study areas. Coordinates are WGS84 degrees; sizes are metres.
#
# role:
#   development fixture     frozen data used to test the pipeline and reproduce Phase 0;
#                           never for thesis results
#   provisional study area  candidate study district used for development; not approved
#   study district          the area the thesis reports on
# approved: true only once the supervisor has approved the area as the study district.
# snapshot: name of the OpenStreetMap snapshot in data/raw/osm (defaults to the area name).
# A snapshot is never overwritten; a new download needs a new snapshot name.
#
# The study district is tahrir_bab_al_sharqi_study (decision A1, configs/approvals.yaml),
# approved on condition that its tall buildings can be observed.
areas:
  tahrir_bab_al_sharqi:
    role: development fixture
    approved: false
    description: >-
      Tahrir Square / Bab Al-Sharqi, central Baghdad. Chosen in Phase 0 because its
      footprints are dense in OpenStreetMap. 97 % of its buildings have no height
      information, so it is a test bed for the pipeline, not a research dataset.
    center: {lat: 33.3280, lon: 44.4085}
    receiver_area_m: [1000.0, 1000.0]
    margin_m: 150.0
    snapshot: tahrir_bab_al_sharqi      # Phase 0 download; lacks multipolygon geometry; frozen

  tahrir_bab_al_sharqi_study:
    role: study district
    approved: true
    approved_by: supervisor, as reported by the project owner on 2026-11-26 (written reference pending; configs/approvals.yaml)
    condition: approved on condition that the tall buildings can be observed (decision A1/A2)
    description: >-
      The approved study district (decision A1): Tahrir Square / Bab Al-Sharqi, same boundary
      as the development area. Uses the 2026-11-26 snapshot of tahrir_bab_al_sharqi_v2
      (SHA-256 852683848789...), read-only. Footprints missing from OSM are added from
      3D-GloBFP (A2); heights need the field observations before research runs.
    center: {lat: 33.3280, lon: 44.4085}
    receiver_area_m: [1000.0, 1000.0]
    margin_m: 150.0
    snapshot: tahrir_bab_al_sharqi_v2
    # Footprints: OSM plus the footprints missing from OSM taken from 3D-GloBFP (footprints
    # only; its heights are not used). Footprint provenance (footprint_source) and height
    # provenance (category, source) are recorded separately for every building.
    footprint_sources: [osm, 3d_globfp]
    # Mandatory observations (A2, reduced fieldwork approved 2026-11-27 as reported): the
    # initial stage is P0-P2 (38 buildings: tall, conflicting, shadowing the candidates) plus
    # the candidate survey S (43 candidate roofs, storey counts at least). P3 (152 buildings)
    # is covered by the building-height sensitivity analysis instead of observation.
    # The historical requirement is kept on record below; the full worklist stays in
    # outputs/datasets/tahrir_bab_al_sharqi_study/height_worklist.csv. The reduced list is the
    # initial stage only: the supervisor may extend it after the stage-1 results.
    observations:
      worklist: outputs/datasets/tahrir_bab_al_sharqi_study/fieldwork/observation_priorities.csv
      required_priorities: [P0, P1, P2, S]
      # Which observation satisfies a required building (method_class of the fieldwork file):
      # P0-P2 a measured or documented height (recorded as observed); S a storey-count survey
      # record with the storey count (recorded as estimated, storeys x storey height). A measured
      # or documented height also satisfies S. Visual estimates satisfy no required building.
      # Specified by the project owner on 2026-11-27 (P2 was "measured if possible, otherwise a
      # storey count" in the earlier fieldwork guide).
      method_requirements:
        P0: [measured, documented]
        P1: [measured, documented]
        P2: [measured, documented]
        S: [storey_count, measured, documented]
      stage: initial
      covered_by_sensitivity: [P3]
      history:
        - {from: 2026-11-26, required_priorities: [P0, P1, P2, P3], buildings: 190,
           basis: approved method A2 as recommended (whole worklist)}
        - {from: 2026-11-27, required_priorities: [P0, P1, P2, S], buildings: 81,
           basis: reduced fieldwork, initial stage (reported approval)}

  tahrir_bab_al_sharqi_v2:
    role: provisional study area
    approved: false
    description: >-
      Same area as the fixture, from a new snapshot taken with the corrected query that
      includes multipolygon buildings. Provisional development area until the supervisor
      chooses the study district.
    center: {lat: 33.3280, lon: 44.4085}
    receiver_area_m: [1000.0, 1000.0]
    margin_m: 150.0
    snapshot: tahrir_bab_al_sharqi_v2

# How OpenStreetMap tags and observations become heights (decision A2, configs/approvals.yaml).
height_policy:
  # Decision A2 approved: this priority, storey height 3.0 m, no external dataset as the height
  # source (3D-GloBFP heights and GlobalBuildingAtlas rejected; an external dataset enters only
  # if separately authorised), field observations for the required worklist buildings.
  approved_by: supervisor, as reported by the project owner on 2026-11-26 (written reference pending)
  external_height_dataset: none   # none authorised; "dataset" in the priority stays unused
  height_sensitivity: enabled     # missing heights reported as a spread (configs/height_models.yaml)
  storey_height_m: 3.0            # used when only building:levels is tagged
  placeholder_height_m: 9.0       # assigned when a building has no height information
  max_plausible_height_m: 250.0   # larger tag values are treated as mapping errors
  # Which source wins when a building has several (approved, A2). Storey counts rank above
  # modelled datasets: a storey count is information about the building itself, whereas the
  # one dataset evaluated here (3D-GloBFP) was 26 m too high on average on tagged buildings
  # (docs/building-height-data.md, section 9).
  priority:
    - observation     # measured or documented field observation (storey counts and visual
                      # estimates enter here too, recorded as "estimated")
    - osm_height      # OSM height tag
    - osm_levels      # OSM building:levels x storey height
    - dataset         # per-building external dataset, matched by footprint
    - model           # supervisor-approved statistical height model
    - placeholder     # explicit development placeholder
