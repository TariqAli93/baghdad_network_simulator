# Base-station site rule (decision A4; research baseline, approved).
#
# Values that are radio-system parameters are NOT repeated here; they live in
# configs/radio_system.yaml (single source of truth) and are only named below:
#   mast height above the roof   antenna_height_above_roof_m   (3 m)
#   sectors and bearings         sectors_per_site              (3 -> compass bearings 0, 120, 240 deg:
#                                                                0 = north, clockwise; converted to the
#                                                                ray tracer's yaw = 90 deg - bearing)
#   downtilt                     mechanical_downtilt_deg       (10 deg)
#
# antenna_position: roof_edge  each sector stands at the roof edge in the direction it points,
#                              edge_inset_m inside the footprint
#                   interior   all sectors at one interior point of the roof (development runs
#                              before the approval; kept for comparison and old manifests)
antenna_position: roof_edge
edge_inset_m: 1.0
radio_parameters: [antenna_height_above_roof_m, sectors_per_site, mechanical_downtilt_deg]

# Candidate rooftops
candidate_height_categories: [observed, estimated]   # observed or storey-based heights only
candidate_count_target: [20, 40]
# Structures that are never transmitter candidates (they stay in the scene as obstacles):
# OSM historic=*, memorial=*, tourism=artwork, man_made=monument|obelisk
# (bns.geospatial.sites.is_structure_not_building).
excluded_structures: [monument, memorial, artwork]
site_selection: interference-aware SINR greedy over physical sites (scripts/plan_sites.py)

# Initial selection thresholds (approved 2026-11-27). After the survey they may be refined to
# obtain a candidate pool of 20-40 roofs; every refinement is recorded in `adjustments` with its
# geometric justification (candidate count, spacing, roof sizes) and never chosen from coverage
# results. Experiments with other values run as custom experiments and record the values used.
candidate_thresholds:
  min_roof_height_m: 12.0
  min_roof_area_m2: 100.0
  min_spacing_m: 125.0
  adjustments:
    - date: 2026-11-27
      change: min_spacing_m 50 -> 125 (height 12 m and area 100 m2 unchanged)
      dataset: tahrir_bab_al_sharqi_study, Synthetic Urban Model synthetic-urban-1, seed 42
      justification: >-
        Geometry only (no coverage result consulted). With 50 m spacing the receiver area has 102
        candidates on the baseline scenario (67 low, 141 high), far above the 20-40 target.
        125 m is the smallest spacing tested (50, 75, 100, 125, 150 m) that gives 20-40 candidates
        in all three height scenarios: 29 low, 30 baseline, 33 high. Re-evaluate when observed
        heights replace the synthetic ones.

status: approved
approved_by: supervisor, as reported by the project owner (2026-11-26, 2026-11-27; configs/approvals.yaml)
