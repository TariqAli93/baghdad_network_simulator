# External building-height datasets known to the project (docs/building-height-data.md).
# The original files are large and are cached in data/cache/datasets/ (git-ignored); the
# study-area extracts and their manifests are kept in data/raw/heights/.
# A dataset listed here is NOT approved as a height source (decision D2).
datasets:
  3d_globfp:
    name: 3D-GloBFP
    version: "figshare v4 (part V, grid IDs 1300-1699)"
    year_of_heights: 2020
    doi: 10.6084/m9.figshare.28890593.v4
    published: 2025-12-05
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Y. Che, X. Li, X. Liu, Y. Wang, W. Liao, X. Zheng, X. Zhang, X. Xu, "3D-GloBFP: the
      first global three-dimensional building footprint dataset", Earth System Science Data,
      16, 5357-5374, 2024. https://essd.copernicus.org/articles/16/5357/2024/
    method: >-
      Building heights estimated per footprint with an XGBoost model from Sentinel-1/2,
      elevation, night-light and population data; a model estimate, not a measurement.
    stated_accuracy: >-
      RMSE 1.9-14.6 m and R2 0.66-0.96 across 33 validation subregions (dataset record);
      no validation in Iraq.
    tile: 1590_43.75_32.5_45.0_33.75_IZ
    file: 1590_43.75_32.5_45.0_33.75_IZ.zip
    url: https://ndownloader.figshare.com/files/54046820
    size_bytes: 205205235
    md5: 243450f2c0c0ba1ae537e7bd0a8a9f1b
    sha256: 6147758ea67d3a174cca63ad17e2ac347e3ac994aec3dc9f611752a5429b3dba
    crs: EPSG:4326
    height_field: Height
    downloaded: 2026-11-26

  gba:
    name: GlobalBuildingAtlas
    version: "GBA.LoD1 heights (JSON), Hugging Face zhu-xlab/GBA.LoD1"
    revision: 9da24b3a8dce436a7420d5c3589de718d7ba14d6
    revision_modified: 2026-03-31
    licence: CC BY-NC 4.0
    licence_url: https://creativecommons.org/licenses/by-nc/4.0/
    licence_note: >-
      Non-commercial use only; the dataset card warns that combining it with the ODbL
      polygon part may have licence implications. Acceptable for a non-commercial thesis
      only if the supervisor agrees (decision A2).
    citation: >-
      X. X. Zhu, S. Chen, F. Zhang, Y. Shi, Y. Wang, "GlobalBuildingAtlas: an open global
      and complete dataset of building polygons, heights and LoD1 3D models", Earth System
      Science Data (preprint essd-2025-327).
    method: >-
      Heights estimated per footprint by a model from satellite data; a model estimate, not a
      measurement. The "var" field is not defined in the dataset card.
    file: e040_n35_e045_n30.json
    url: https://huggingface.co/datasets/zhu-xlab/GBA.LoD1/resolve/9da24b3a8dce436a7420d5c3589de718d7ba14d6/LoD1/africa/e040_n35_e045_n30.json
    size_bytes: 378494857
    sha256: 1d1246f809e03115276d2fc4a0806e197cd3dd22eb6f69a9b4d05fda3d0fd102
    geometry: none (heights keyed by footprint id; footprints are in GBA.Polygon / GBA.ODbLPolygon)
    downloaded: 2026-11-26
